<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="LMC - Livro de Movimentação de Combustíveis">
  <title>LMC - Livro de Movimentação de Combustíveis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div><h1>⛽ LMC</h1><p>Livro de Movimentação de Combustíveis</p></div><span class="status" id="systemStatus">Sistema inicial</span></header>
<main class="container">
<section class="welcome" id="welcome"><h2>Painel de Controle</h2><p>Cadastre o posto, produtos, tanques, bombas e bicos para começar a registrar a movimentação.</p></section>
<section class="cards" id="cards">
<button class="card" onclick="openModule('Produtos')"><strong>⛽</strong><span>Produtos</span><small>Combustíveis cadastrados</small></button>
<button class="card" onclick="openModule('Tanques')"><strong>🛢️</strong><span>Tanques</span><small>Controle dos tanques</small></button>
<button class="card" onclick="openModule('Bombas e Bicos')"><strong>🔢</strong><span>Bombas e Bicos</span><small>Equipamentos e bicos</small></button>
<button class="card" onclick="openModule('Entradas')"><strong>📥</strong><span>Entradas</span><small>Recebimento de combustível</small></button>
<button class="card" onclick="openModule('Movimentação Diária')"><strong>📋</strong><span>Movimentação Diária</span><small>Registros do dia</small></button>
<button class="card" onclick="openModule('Livro LMC')"><strong>📘</strong><span>Livro LMC</span><small>Consulta e fechamento</small></button>
<button class="card" onclick="openModule('Relatórios')"><strong>📊</strong><span>Relatórios</span><small>Resumo das movimentações</small></button>
<button class="card" onclick="openModule('Configurações')"><strong>⚙️</strong><span>Configurações</span><small>Dados do estabelecimento</small></button>
<button class="card" onclick="openModule('Backup e Restauração')"><strong>💾</strong><span>Backup e Restauração</span><small>Salvar e recuperar os dados</small></button>
</section>
<section id="module" class="module hidden"></section>
</main>
<footer>LMC Combustíveis • Versão 1.5</footer>
<script src="app.js"></script>
<script src="relatorios.js"></script>
<script src="backup.js"></script>
<script src="login.js"></script>
<script>
const _openModuleLmc=openModule;
window.openModule=function(name){if(name==='Backup e Restauração'){cards.classList.add('hidden');welcome.classList.add('hidden');module.classList.remove('hidden');renderBackup();return;}_openModuleLmc(name)};
if(typeof isAuthenticated==='function'&&isAuthenticated()){
  const topbar=document.querySelector('.topbar');
  if(topbar&&!document.getElementById('logoutLmc')){const b=document.createElement('button');b.id='logoutLmc';b.textContent='Sair';b.onclick=logoutLmc;b.style.cssText='background:#b42318;color:#fff;border:0;border-radius:9px;padding:10px 16px;cursor:pointer';topbar.appendChild(b)}
}
</script>
</body>
</html>
